<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="xterm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Верхняя панель: кнопка подключения и переключатель местного эха — одной
     * строкой, ничего лишнего. Состояние и настройки живут в подвале. */
    .control-panel {
      background: #1e1e1e;
      padding: 8px 10px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .control-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: nowrap;
    }

    .button {
      padding: 7px 16px;
      background: #0a84ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: sans-serif;
      font-weight: bold;
    }

    /* Кнопка подключения: зелёная «Подключиться», пока связи нет, и красная
     * «Отключиться», когда подключились. Класс переставляет script.js. */
    #connect-btn { background: #2e9b4f; }
    #connect-btn:hover { background: #37b85e; }
    #connect-btn.connected { background: #c0392b; }
    #connect-btn.connected:hover { background: #e04a37; }

    .button.toggle { background: #2d2d2d; border: 1px solid #444; color: #9aa4b2; font-weight: normal; }
    .button.toggle.on { background: #1f6f3f; border-color: #2e8b57; color: #eaffea; }

    #terminal-container {
      flex: 1;
      overflow: hidden;
      background: #000;
    }

    #terminal {
      width: 100%;
      height: 100%;
    }

    /* Подвал: две строки — состояние сеанса и настройки порта. */
    .footer-panel {
      background: #1a1a1a;
      padding: 8px 10px;
      border-top: 1px solid #333;
      flex-shrink: 0;
      font-size: 12px;
      color: #9aa4b2;
    }

    .stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 6px;
    }

    .stats b { color: #e0e0e0; font-weight: 600; }
    .stats b.err { color: #ff8a80; }
    .stats b.ok { color: #69f0ae; }

    .settings {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .set { display: flex; align-items: center; gap: 5px; }
    .set > span { text-transform: uppercase; letter-spacing: .3px; }

    .set select {
      padding: 3px 6px;
      background: #2d2d2d;
      border: 1px solid #444;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
    }

    .set select:disabled { opacity: .45; cursor: not-allowed; }
    .cfg-state { margin-left: auto; color: #7f8c9a; }
  </style>
</head>
<body>
  <div id="app-container">
    <div class="control-panel">
      <div class="control-row">
        <button id="connect-btn" class="button">Подключиться</button>
        <button id="echo-btn" class="button toggle"
                title="Местное эхо: показывать набранное сразу, не дожидаясь ответного эха линии. Нужно на полудуплексной линии — там ответное эхо приходит только когда мы молчим. На полнодуплексной эхо вернёт удалённая сторона, и тогда эхо лучше выключить, иначе строка видна дважды."
                aria-label="Местное эхо набора">Эхо: вкл</button>
      </div>
    </div>

    <div id="terminal-container">
      <div id="terminal"></div>
    </div>

    <div class="footer-panel">
      <div class="stats">
        <span>Порт: <b id="channel-name">uart2</b></span>
        <span>Состояние: <b id="status-text">отключено</b></span>
        <span>Пакетов: <b id="packet-count">0</b></span>
        <span>Обмен: <b id="last-activity">—</b></span>
      </div>

      <!-- Настройки порта: выбираются до подключения, их применяет кнопка
           «Подключиться». Пока сеанс жив, списки заблокированы. -->
      <div class="settings">
        <label class="set"><span>порт</span>
          <select id="port-sel">
            <option value="2">uart2</option>
            <option value="1">uart1</option>
            <option value="0">uart0</option>
          </select>
        </label>
        <label class="set"><span>режим</span>
          <select id="mode-sel"
                  title="Дуплекс — раздельные линии приёма и передачи. Полудуплекс — одна пара (RS-485), направлением управляет драйвер, приём на время передачи он глушит сам. Однопроводный — RX и TX сведены вместе (или приёмник включён при передаче): прибор сам отбрасывает то, что вернулось эхом от своей же посылки.">
            <option value="0">Дуплекс</option>
            <option value="1">Полудуплекс</option>
            <option value="2">Однопроводный</option>
          </select>
        </label>
        <label class="set"><span>скорость</span>
          <select id="baud-sel">
            <option>1200</option><option>2400</option><option>4800</option>
            <option>9600</option><option>19200</option><option>38400</option>
            <option>57600</option><option>115200</option><option>230400</option>
            <option>460800</option><option>500000</option>
          </select>
        </label>
        <label class="set"><span>данные</span>
          <select id="bits-sel" title="Биты данных">
            <option value="8">8</option>
            <option value="7">7</option>
          </select>
        </label>
        <label class="set"><span>чётность</span>
          <select id="par-sel">
            <option value="0">None</option>
            <option value="2">Even</option>
            <option value="1">Odd</option>
          </select>
        </label>
        <label class="set"><span>стоп</span>
          <select id="stop-sel" title="Стоп-биты">
            <option value="1">1</option>
            <option value="3">1.5</option>
            <option value="2">2</option>
          </select>
        </label>
        <span class="cfg-state" id="cfg-state"></span>
      </div>
    </div>
  </div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="script.js"></script>
  <script>
    window.addEventListener('load', function() {
      window.espTerminal = new ESP32Terminal();
      window.addEventListener('resize', function() {
        window.espTerminal.fitAddon.fit();
      });
    });
  </script>
</body>
</html>
