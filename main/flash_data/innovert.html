<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            margin: 0;
            background: #f0f2f5;
            color: #1a1a2e;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
            color: #fff;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,.35);
            min-height: 52px;
        }
        .header-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: .5px;
            color: #e0e6f0;
            white-space: nowrap;
        }
        .header-sep { flex: 1; }
        .header label { display: inline-flex; align-items: center; gap: 5px; color: #aab4c8; font-size: 0.82em; white-space: nowrap; }
        .header select, .header input[type=number] {
            background: #0f3460;
            color: #e0e6f0;
            border: 1px solid #2a4a80;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 12px;
            width: auto;
        }
        .header button {
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 5px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: background .15s;
        }
        .header button:hover { background: #c73652; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 700;
            letter-spacing: .3px;
            white-space: nowrap;
        }
        .badge::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
        .badge.ok  { background: #1b4332; color: #52c97a; }
        .badge.ok::before  { background: #52c97a; box-shadow: 0 0 4px #52c97a; }
        .badge.err { background: #4a1020; color: #f87171; }
        .badge.err::before { background: #f87171; }

        /* ── UART config strip ── */
        .uart-config {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 7px 16px;
            background: #1e2a3a;
            border-bottom: 1px solid #2a3a50;
            font-size: 12px;
            color: #8899aa;
        }
        .uart-config b { color: #aab4c8; font-weight: 600; }
        .uart-config label { display: inline-flex; align-items: center; gap: 4px; }
        .uart-config select {
            background: #0f1e2e;
            color: #c8d6e5;
            border: 1px solid #2a3a50;
            border-radius: 4px;
            padding: 2px 5px;
            font-size: 12px;
            width: auto;
        }
        .uart-config button {
            background: #0f3460;
            color: #c8d6e5;
            border: 1px solid #2a4a80;
            border-radius: 4px;
            padding: 3px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background .15s;
        }
        .uart-config button:hover { background: #1a4a80; }

        /* ── Main layout ── */
        .main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }

        /* ── Gauge card ── */
        .gauges-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            padding: 12px 16px 8px;
            flex: 0 0 auto;
        }
        .gauges-card h3 {
            margin: 0 0 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: #6b7280;
        }
        .gauges { display: flex; flex-wrap: wrap; gap: 4px; }
        .gauge-wrap { display: flex; flex-direction: column; align-items: center; }
        .gauge-label { font-size: 11px; font-weight: 600; color: #6b7280; margin-top: 2px; letter-spacing: .3px; }

        /* ── Register table card ── */
        #reg-table-wrap {
            flex: 1 1 580px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            padding: 12px 16px;
            overflow-x: auto;
        }
        #reg-table-wrap h3 {
            margin: 0 0 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: #6b7280;
        }

        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #e5e7eb; padding: 5px 9px; text-align: left; }
        th {
            background: #f8fafc;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #6b7280;
        }
        tr:hover td { background: #f0f7ff; }
        tr.group-header td {
            background: linear-gradient(90deg, #1a1a2e, #0f3460);
            color: #c8d6e5;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: .4px;
            border-color: #0f3460;
        }
        tr.ro td { color: #9ca3af; }
        .updating { background-color: #fef9c3 !important; }

        /* ── Form elements in table ── */
        select, input[type="number"], input[type="text"] {
            width: 130px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 12px;
            background: #fff;
        }
        select:focus, input:focus { outline: 2px solid #0f3460; border-color: transparent; }
        label { display: block; margin: 2px 0; }
        button {
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 3px 10px;
            background: #f8fafc;
            cursor: pointer;
            font-size: 12px;
            transition: background .15s;
        }
        button:hover { background: #e5e7eb; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-title">⚡ Innovert — Частотный преобразователь</div>
    <div class="header-sep"></div>
    <span id="ws-status" class="badge err">Нет соединения</span>
    <label>Адрес MB:&nbsp;<input type="number" id="mb-addr" value="1" min="1" max="247" style="width:52px"></label>
    <label>UART:&nbsp;
        <select id="uart-sel">
            <option value="4371">UART1 (0x1113)</option>
            <option value="4387">UART2 (0x1123)</option>
        </select>
    </label>
    <button onclick="reconnectWs()">Переподключить</button>
</div>
<div class="uart-config">
    <b>UART шлюза:</b>
    <label>Скорость&nbsp;
        <select id="uart-baud">
            <option value="1200">1200</option>
            <option value="2400">2400</option>
            <option value="4800">4800</option>
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="38400">38400</option>
            <option value="57600">57600</option>
            <option value="115200" selected>115200</option>
        </select>
    </label>
    <label>Чётность&nbsp;
        <select id="uart-par">
            <option value="0" selected>None</option>
            <option value="1">Odd</option>
            <option value="2">Even</option>
        </select>
    </label>
    <label>Стоп-биты&nbsp;
        <select id="uart-sb">
            <option value="1" selected>1</option>
            <option value="2">2</option>
        </select>
    </label>
    <button onclick="sendUartConfig()">Записать</button>
</div>
<div class="main">
    <div class="gauges-card">
        <h3>Мониторинг</h3>
        <div class="gauges" id="gauges"></div>
    </div>
    <div id="reg-table-wrap">
        <h3>Регистры</h3>
    </div>
</div>

            {name:"PH", desc:"Группа параметров последовательного канала связи", regs:[
                {ADR:700, DESC:"Скорость передачи данных, бит/сек", ACCESS:2, OPT:{ENUM: [{VAL:0, DESC:"4800"}, {VAL:1, DESC:"9600"}]}, VALUE:0},
                {ADR:701, DESC:"Формат данных", ACCESS:2, OPT:{ENUM: [{VAL:0, DESC:"8N1 для ASCII"}, {VAL:1, DESC:"8E1 для ASCII"}, {VAL:2, DESC:"8O1 для ASCII"}, {VAL:3, DESC:"8N1 для RTU"}, {VAL:4, DESC:"8E1 для RTU"}, {VAL:5, DESC:"8O1 для RTU"}]}, VALUE:1},
                {ADR:702, DESC:"Адрес преобразователя при последовательной связи", ACCESS:2, OPT:{RANGE: {MIN:0, MAX:247}, SCALE:1, DESC:"Адрес"}, VALUE:0},
                {ADR:703, DESC:"Действие при ошибке обмена данными", ACCESS:2, OPT:{ENUM: [{VAL:0, DESC:"Нет действий"}, {VAL:1, DESC:"Отображение на экране ошибки «Со»"}, {VAL:2, DESC:"Отображение на экране ошибки «Со» и останов"}]}, VALUE:0},
                {ADR:704, DESC:"Время сторожевого таймера", ACCESS:2, OPT:{RANGE: {MIN:0.0, MAX:100.0}, SCALE:10, DESC:"Секунды"}, VALUE:5.0}
            ]},
            {name:"PI", desc:"Параметры для усложненного применения", regs:[
                {ADR:800, DESC:"Блокировка параметров усложненного применения", ACCESS:2, OPT:{ENUM: [{VAL:0, DESC:"Блокирован"}, {VAL:1, DESC:"Доступ разрешен"}]}, VALUE:1},
                {ADR:801, DESC:"Установка частоты 50Гц или 60 Гц", ACCESS:2, OPT:{ENUM: [{VAL:0, DESC:"50 Гц"}, {VAL:1, DESC:"60 Гц"}]}, VALUE:0},
                {ADR:803, DESC:"Установка уровня срабатывания защиты от перенапряжения", ACCESS:2, OPT:{RANGE: {MIN:0.0, MAX:400.0}, DESC:"Вольт"}, VALUE:0},
                {ADR:804, DESC:"Установка уровня защиты от низкого напряжения", ACCESS:2, OPT:{RANGE: {MIN:0.0, MAX:400.0}, DESC:"Вольт"}, VALUE:0},
                {ADR:806, DESC:"Настройка времени изменения показаний дисплея", ACCESS:2, OPT:{RANGE: {MIN:0.0, MAX:10.0}, SCALE:10, DESC:"Секунды"}, VALUE:2.0},
                {ADR:807, DESC:"Коэффициент коррекции минимального значения аналогового выхода 0-10 В", ACCESS:2, OPT:{RANGE: {MIN:0, MAX:8190}, SCALE:1, DESC:"Код"}, VALUE:0},
                {ADR:808, DESC:"Коэффициент коррекции максимального значения аналогового выхода 0-10 В", ACCESS:2, OPT:{RANGE: {MIN:0, MAX:8190}, SCALE:1, DESC:"Код"}, VALUE:0},
                {ADR:812, DESC:"Запоминание частоты, достигнутой в режиме UP / DOWN", ACCESS:2, OPT:{ENUM: [{VAL:0, DESC:"Без запоминания"}, {VAL:1, DESC:"С запоминанием"}]}, VALUE:0},
                {ADR:816, DESC:"Защита двигателя от перегрузки по току", ACCESS:2, OPT:{ENUM: [{VAL:0, DESC:"Отключена"}, {VAL:1, DESC:"Включена"}]}, VALUE:1}
            ]}
        ];

        // build flat map
        for (const g of this.groups)
            for (const r of g.regs)
                this._regMap.set(r.ADR, r);

        this.runExchange();
        this.createRegistersTable();
    }

    // ── helpers ───────────────────────────────────────────────

    getReg(addr) { return this._regMap.get(addr) || null; }

    getRegDescription(reg) {
        if (reg.OPT?.ENUM) {
            return reg.OPT.ENUM.find(e => e.VAL === reg.VALUE)?.DESC || '';
        }
        if (reg.OPT?.MASK) {
            return reg.OPT.MASK.map(m => (reg.VALUE & m.VAL) ? m.DESC : null)
                             .filter(Boolean).join(', ') || 'None';
        }
        if (reg.OPT?.BCD) {
            const parts = [];
            let rem = reg.VALUE;
            for (let i = reg.OPT.BCD.length - 1; i >= 0; i--) {
                const bits = reg.OPT.BCD[i] * 4;
                const mask = (1 << bits) - 1;
                parts.unshift((rem & mask).toString(16).padStart(reg.OPT.BCD[i], '0'));
                rem >>= bits;
            }
            return parts.join('.');
        }
        if (reg.OPT?.SCALE) {
            return (reg.VALUE / reg.OPT.SCALE).toFixed(
                reg.OPT.SCALE >= 100 ? 2 : reg.OPT.SCALE >= 10 ? 1 : 0
            ) + (reg.OPT.DESC ? ' ' + reg.OPT.DESC : '');
        }
        return '';
    }

    // ── table ────────────────────────────────────────────────

    createRegistersTable() {
        if (this.tableElement) this.tableElement.remove();

        const table = document.createElement('table');
        table.id = 'registers_table';

        table.innerHTML = `<tr>
            <th>Адрес</th>
            <th>Описание</th>
            <th>Значение</th>
            <th>Описание значения</th>
            <th>Управление</th>
        </tr>`;

        for (const g of this.groups) {
            // group header row
            const hrow = table.insertRow();
            hrow.className = 'group-header';
            const hcell = hrow.insertCell();
            hcell.colSpan = 5;
            hcell.textContent = g.name + ' — ' + g.desc;

            for (const reg of g.regs) {
                const row = table.insertRow();
                if (reg.ACCESS < 2) row.className = 'ro';

                row.insertCell().textContent = reg.ADR;

                const dc = row.insertCell();
                dc.textContent = reg.DESC;

                const vc = row.insertCell();
                vc.id = `rv_${reg.ADR}`;
                vc.textContent = reg.VALUE;

                const od = row.insertCell();
                od.id = `rd_${reg.ADR}`;
                od.textContent = this.getRegDescription(reg);

                const cc = row.insertCell();
                if (reg.ACCESS >= 2) {
                    const wrap = document.createElement('div');
                    let inp;

                    if (reg.OPT?.ENUM) {
                        inp = document.createElement('select');
                        for (const opt of reg.OPT.ENUM) {
                            const o = document.createElement('option');
                            o.value = opt.VAL; o.text = opt.DESC;
                            inp.appendChild(o);
                        }
                        inp.value = reg.VALUE;
                    } else if (reg.OPT?.MASK) {
                        inp = document.createElement('div');
                        for (const m of reg.OPT.MASK) {
                            const lbl = document.createElement('label');
                            const cb = document.createElement('input');
                            cb.type = 'checkbox'; cb.value = m.VAL;
                            cb.checked = !!(reg.VALUE & m.VAL);
                            lbl.appendChild(cb);
                            lbl.appendChild(document.createTextNode(m.DESC));
                            inp.appendChild(lbl);
                        }
                    } else if (reg.OPT?.BCD) {
                        inp = document.createElement('input');
                        inp.type = 'text';
                        inp.placeholder = reg.OPT.BCD.map(n => '0'.repeat(n)).join('.');
                    } else {
                        inp = document.createElement('input');
                        inp.type = 'number';
                        if (reg.OPT?.RANGE) {
                            inp.min = reg.OPT.RANGE.MIN;
                            inp.max = reg.OPT.RANGE.MAX;
                            inp.step = reg.OPT.SCALE ? 1 / reg.OPT.SCALE : 1;
                        }
                        inp.value = reg.OPT?.SCALE ? reg.VALUE / reg.OPT.SCALE : reg.VALUE;
                    }

                    const btn = document.createElement('button');
                    btn.textContent = 'Записать';
                    btn.onclick = () => this.writeRegister(reg.ADR, inp);
                    wrap.appendChild(inp);
                    wrap.appendChild(btn);
                    cc.appendChild(wrap);
                }
            }
        }

        this.tableElement = table;
        document.getElementById('reg-table-wrap').appendChild(table);
    }

    updateRegistersTable() {
        for (const [adr, reg] of this._regMap) {
            const vc = document.getElementById(`rv_${adr}`);
            if (vc) vc.textContent = reg.VALUE;
            const od = document.getElementById(`rd_${adr}`);
            if (od) od.textContent = this.getRegDescription(reg);
        }
    }

    // ── write ─────────────────────────────────────────────────

    writeRegister(addr, inp) {
        const reg = this.getReg(addr);
        if (!reg) { alert('Регистр не найден'); return; }

        let val;
        if (inp.tagName === 'SELECT') {
            val = parseInt(inp.value);
        } else if (inp.tagName === 'DIV') {
            val = Array.from(inp.querySelectorAll('input'))
                       .reduce((a, cb) => a | (cb.checked ? parseInt(cb.value) : 0), 0);
        } else if (reg.OPT?.BCD) {
            const parts = inp.value.toLowerCase().split('.');
            if (parts.length !== reg.OPT.BCD.length) { alert('Неверный формат BCD'); return; }
            val = 0;
            for (let i = 0; i < reg.OPT.BCD.length; i++) {
                val = (val << (reg.OPT.BCD[i] * 4)) | parseInt(parts[i].padStart(reg.OPT.BCD[i],'0'), 16);
            }
        } else {
            const fval = parseFloat(inp.value);
            if (isNaN(fval)) { alert('Некорректное значение'); return; }
            val = reg.OPT?.SCALE ? Math.round(fval * reg.OPT.SCALE) : Math.round(fval);
        }

        const req = `{"FID":${getMbFid()},"FLAGS":0,"SID":${nextSid()},"ARG":{"FN":6,"ADR":${getMbAddr()},"RA":${addr},"RVC":${val}}}`;
        if (this.websocket?.readyState === WebSocket.OPEN) {
            this.websocket.send(req);
        } else {
            alert('Соединение не установлено');
        }
    }

    // ── WebSocket ─────────────────────────────────────────────

    runExchange() {
        this.websocket = new WebSocket(this.gateway);
        this.websocket.onopen = () => {
            setWsStatus(true);
            console.log('Innovert connected');
            sendUartConfig();
            this.subscribeRegs();
        };
        this.websocket.onclose = () => {
            setWsStatus(false);
            console.log('Innovert disconnected, retrying…');
            setTimeout(() => this.runExchange(), 500);
        };
        this.websocket.onmessage = (e) => this.wsMessage(e);
        this.websocket.onerror   = (e) => console.error('WS error', e);
    }

    wsMessage(e) {
        const obj = JSON.parse(e.data);
        const fid = parseInt(obj.FID, 16);
        if (fid === 0x1010 || fid === 0x1020) { console.log('UART CNF', obj.ARG); return; }
        if (fid === getMbFid()) { this.modbusHandler(obj.ARG); }
    }

    modbusHandler(arg) {
        if (arg?.RA == null || !arg?.RC || !arg?.RD) return;
        const start  = arg.RA;
        const count  = arg.RC;
        const values = arg.RD.map(x => parseInt(x));
        for (let i = 0; i < count && i < values.length; i++) {
            const reg = this._regMap.get(start + i);
            if (reg) reg.VALUE = values[i];
        }
        this.updateRegistersTable();
    }

    subscribeRegs() {
        const fid  = getMbFid();
        const addr = getMbAddr();
        const addrs = [...this._regMap.keys()].sort((a, b) => a - b);
        const ranges = [];
        let s = addrs[0], e = addrs[0];
        for (let i = 1; i < addrs.length; i++) {
            if (addrs[i] === e + 1 && e - s < 99) { e = addrs[i]; }
            else { ranges.push({s, n: e - s + 1}); s = e = addrs[i]; }
        }
        ranges.push({s, n: e - s + 1});

        for (const {s, n} of ranges) {
            const req = `{"FID":${fid},"FLAGS":4,"SID":${nextSid()},"ARG":{"AWT":500,"RDL":250,"FN":3,"ADR":${addr},"RA":${s},"RVC":${n}}}`;
            if (this.websocket?.readyState === WebSocket.OPEN) this.websocket.send(req);
        }
    }
}

// ── Gauge ─────────────────────────────────────────────────────

class Gauge {
    constructor(size, units, holder, color = '#4CAF50') {
        const id = 'gv_' + Math.random().toString(36).slice(2);
        this.elem = document.createElement('div');
        this.elem.style.cssText = `width:${size};height:${size};position:relative;margin:5px;`;
        this.elem.innerHTML = `
            <svg viewBox="0 0 200 200" style="position:absolute;width:100%;height:100%;">
                <path class="arc-bg" style="fill:none;stroke:#e2e8f0;stroke-width:10;stroke-linecap:round;"
                      d="M22.06 145 A90 90 0 1 1 177.94 145"/>
                <path class="arc" style="fill:none;stroke:${color};stroke-width:10;stroke-linecap:round;"
                      d="M22.06 145 A90 90 0 1 1 177.94 145"/>
                <text x="50%" y="62%" font-size="18px" fill="#94a3b8" dominant-baseline="middle" text-anchor="middle">${units}</text>
                <text id="${id}" x="50%" y="77%" font-size="34px" fill="#1e293b" font-weight="600" dominant-baseline="middle" text-anchor="middle">${holder}</text>
            </svg>
            <div class="ndl" style="position:absolute;top:50%;left:50%;width:2px;height:40%;
                 background:${color};transform-origin:50% 100%;
                 transition:transform .5s ease-in-out;transform:translate(-50%,-100%) rotate(-120deg);"></div>
            <div style="position:absolute;top:50%;left:50%;width:10px;height:10px;background:${color};
                 border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px ${color};"></div>`;
        this._totalLen = null;
        this.min = 0; this.max = 10;
        this.ndl = this.elem.querySelector('.ndl');
        this.arc = this.elem.querySelector('.arc');
        this.gv  = this.elem.querySelector(`#${id}`);
    }
    _arcLen() {
        if (!this._totalLen) this._totalLen = this.arc.getTotalLength();
        return this._totalLen;
    }
    setScale(mn, mx) { this.min = mn; this.max = mx; }
    setValue(v) {
        v = Math.max(this.min, Math.min(this.max, v));
        const frac = (v - this.min) / (this.max - this.min);
        const a = -120 + frac * 240;
        this.ndl.style.transform = `translate(-50%,-100%) rotate(${a}deg)`;
        this.gv.textContent = v.toFixed(1);
        try {
            const len = this._arcLen();
            this.arc.style.strokeDasharray = `${frac * len} ${len}`;
        } catch(_) {}
    }
    getElement() { return this.elem; }
}

// ── Helpers ───────────────────────────────────────────────────

function getMbFid()  { return parseInt(document.getElementById('uart-sel').value); }
function getCnfFid() { return getMbFid() === 0x1113 ? 0x1010 : 0x1020; }
function getMbAddr() { return parseInt(document.getElementById('mb-addr').value) || 1; }

let _sid = 1;
function nextSid() { return _sid++ & 0xffff; }

function setWsStatus(ok) {
    const el = document.getElementById('ws-status');
    el.className = 'badge ' + (ok ? 'ok' : 'err');
    el.textContent = ok ? 'Подключено' : 'Нет соединения';
}

function sendUartConfig() {
    const arg = {
        BR:  parseInt(document.getElementById('uart-baud').value),
        PAR: parseInt(document.getElementById('uart-par').value),
        SB:  parseInt(document.getElementById('uart-sb').value),
    };
    if (x?.websocket?.readyState === WebSocket.OPEN)
        x.websocket.send(JSON.stringify({ FID: getCnfFid(), FLAGS: 0, SID: nextSid(), ARG: arg }));
}

function reconnectWs() {
    if (x?.websocket) { x.websocket.onclose = null; x.websocket.close(); }
    setWsStatus(false);
    x.runExchange();
}

// ── Init ──────────────────────────────────────────────────────

const gateway = `ws://${window.location.host}/ws`;
const gauge_fb  = new Gauge('160px', 'Hz',  '—', '#3b82f6');
const gauge_rpm = new Gauge('160px', 'RPM', '—', '#8b5cf6');
const gauge_i   = new Gauge('160px', 'A',   '—', '#f59e0b');
const gauge_v   = new Gauge('160px', 'V',   '—', '#10b981');
gauge_fb.setScale(0, 60);
gauge_rpm.setScale(0, 2000);
gauge_i.setScale(0, 20);
gauge_v.setScale(0, 800);
const gc = document.getElementById('gauges');
const gaugeLabels = ['Частота', 'Обороты', 'Ток', 'Напряжение DC'];
[gauge_fb, gauge_rpm, gauge_i, gauge_v].forEach((g, i) => {
    const w = document.createElement('div');
    w.className = 'gauge-wrap';
    w.appendChild(g.getElement());
    const lbl = document.createElement('div');
    lbl.className = 'gauge-label';
    lbl.textContent = gaugeLabels[i];
    w.appendChild(lbl);
    gc.appendChild(w);
});

const x = new InnovertIDDXXX21E(gateway);

function refreshGauges() {
    const gv = (adr, scale) => { const r = x.getReg(adr); return r ? r.VALUE / (scale||1) : 0; };
    gauge_fb.setValue(gv(2, 10));   // output frequency, 0.1 Hz units
    gauge_rpm.setValue(gv(4, 1));   // RPM
    gauge_i.setValue(gv(3, 10));    // output current, 0.1 A units
    gauge_v.setValue(gv(5, 10));    // DC bus voltage, 0.1 V units
    setTimeout(refreshGauges, 150);
}
setTimeout(refreshGauges, 0);
